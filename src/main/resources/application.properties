spring.application.name=smart-inventory-system

# ===============================
# Aiven MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://project-management-db-project-management-tool.c.aivencloud.com:21859/smart_inventory?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Server
# ===============================
server.port=${PORT:5050}